name: Build VideoStarTool

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install dpkg ldid

      - name: Install Theos and iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$HOME/theos-sdks"

          mkdir -p "$HOME/theos/sdks"

          SDK="$(find "$HOME/theos-sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' | sort -V | tail -n 1)"

          if [ -z "$SDK" ]; then
            echo "ERROR: iOS SDK not found"
            exit 1
          fi

          cp -R "$SDK" "$HOME/theos/sdks/"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_PACKAGE_SCHEME=rootless" >> "$GITHUB_ENV"

      - name: Create tweak project
        run: |
          cat > Makefile <<'MAKEFILE'
          TARGET = iphone:clang:latest:17.2
          ARCHS = arm64
          THEOS_PACKAGE_SCHEME = rootless

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = VideoStarTool

          VideoStarTool_FILES = Tweak.xm
          VideoStarTool_FRAMEWORKS = UIKit Foundation Photos AVFoundation
          VideoStarTool_CFLAGS = -fobjc-arc -Wno-deprecated-declarations
          VideoStarTool_PLIST = VideoStarTool.plist

          include $(THEOS_MAKE_PATH)/tweak.mk
          MAKEFILE

          cat > control <<'CONTROL'
          Package: com.hoanghiep.videostartool
          Name: VideoStarTool
          Version: 2.0.0
          Architecture: iphoneos-arm
          Description: VideoStarTool for Video Star
          Maintainer: Hoàng Hiệp
          Author: Hoàng Hiệp
          Section: Tweaks
          Depends: mobilesubstrate
          CONTROL

          cat > VideoStarTool.plist <<'PLIST'
          {
            Filter = {
              Bundles = ("com.frontierdesign.videostar");
            };
          }
          PLIST

          cat > Tweak.xm <<'SOURCE'
          #import <UIKit/UIKit.h>
          #import <Photos/Photos.h>
          #import <AVFoundation/AVFoundation.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <string.h>
          #import <math.h>

          static NSString * const VSTLastCodeKey =
              @"com.hoanghiep.videostartool.lastCode";

          static NSString * const VSTLastCodeImageKey =
              @"com.hoanghiep.videostartool.lastCodeImage";

          static UIWindow *VSTWindow;
          static UIView *VSTPanel;
          static UILabel *VSTStatus;
          static UILabel *VSTCodeLabel;
          static BOOL VSTBusy;

          @interface VSTOverlayWindow : UIWindow
          @end

          @implementation VSTOverlayWindow

          - (BOOL)canBecomeKeyWindow {
              return NO;
          }

          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hit = [super hitTest:point withEvent:event];

              if (hit == self.rootViewController.view) {
                  return nil;
              }

              return hit;
          }

          @end

          static id VSTCall(id obj, NSString *selName) {
              SEL selector = NSSelectorFromString(selName);

              if (!obj || ![obj respondsToSelector:selector]) {
                  return nil;
              }

              return ((id(*)(id, SEL))objc_msgSend)(obj, selector);
          }

          static BOOL VSTBool(id obj, NSString *selName) {
              SEL selector = NSSelectorFromString(selName);

              if (!obj || ![obj respondsToSelector:selector]) {
                  return NO;
              }

              return ((BOOL(*)(id, SEL))objc_msgSend)(obj, selector);
          }

          static void VSTSetStatus(NSString *message) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  VSTStatus.text = message ?: @"";
              });
          }

          static UIViewController *VSTTopController(void) {
              UIWindow *window = nil;

              for (UIScene *scene in UIApplication.sharedApplication.connectedScenes) {
                  if (![scene isKindOfClass:UIWindowScene.class]) {
                      continue;
                  }

                  for (UIWindow *candidate in ((UIWindowScene *)scene).windows) {
                      if (candidate.isKeyWindow) {
                          window = candidate;
                          break;
                      }
                  }

                  if (window) {
                      break;
                  }
              }

              UIViewController *controller = window.rootViewController;

              while (controller.presentedViewController) {
                  controller = controller.presentedViewController;
              }

              while ([controller isKindOfClass:UINavigationController.class] &&
                     ((UINavigationController *)controller).topViewController) {
                  controller = ((UINavigationController *)controller).topViewController;
              }

              return controller;
          }

          static UIView *VSTFindView(UIView *root, NSString *className) {
              if (!root) {
                  return nil;
              }

              if ([NSStringFromClass(root.class) isEqualToString:className]) {
                  return root;
              }

              for (UIView *child in root.subviews) {
                  UIView *found = VSTFindView(child, className);

                  if (found) {
                      return found;
                  }
              }

              return nil;
          }

          static id VSTActiveProject(void) {
              Class managerClass = NSClassFromString(@"Video_Star.ProjectManager");

              SEL sharedSelector = NSSelectorFromString(@"sharedInstance");

              if (!managerClass ||
                  ![managerClass respondsToSelector:sharedSelector]) {
                  return nil;
              }

              id manager = ((id(*)(id, SEL))objc_msgSend)(
                  managerClass,
                  sharedSelector
              );

              return VSTCall(manager, @"activeEditProject");
          }

          static UIViewController *VSTFindEditorController(
              UIViewController *controller
          ) {
              if (!controller) {
                  return nil;
              }

              if ([NSStringFromClass(controller.class)
                   containsString:@"MultiLayerNavController"]) {
                  return controller;
              }

              UIViewController *found =
                  VSTFindEditorController(controller.presentedViewController);

              if (found) {
                  return found;
              }

              if ([controller isKindOfClass:UINavigationController.class]) {
                  for (UIViewController *child in
                       ((UINavigationController *)controller)
                       .viewControllers.reverseObjectEnumerator) {
                      found = VSTFindEditorController(child);

                      if (found) {
                          return found;
                      }
                  }
              }

              for (UIViewController *child in controller.childViewControllers) {
                  found = VSTFindEditorController(child);

                  if (found) {
                      return found;
                  }
              }

              return nil;
          }

          static id VSTActiveEditor(void) {
              for (UIScene *scene in UIApplication.sharedApplication.connectedScenes) {
                  if (![scene isKindOfClass:UIWindowScene.class]) {
                      continue;
                  }

                  for (UIWindow *window in ((UIWindowScene *)scene).windows) {
                      if (!window.isKeyWindow || window == VSTWindow) {
                          continue;
                      }

                      UIViewController *found =
                          VSTFindEditorController(window.rootViewController);

                      if (found) {
                          return found;
                      }
                  }
              }

              return nil;
          }

          static void VSTButton(
              UIView *host,
              NSString *title,
              CGFloat y,
              SEL action,
              id target
          ) {
              UIButton *button = [UIButton buttonWithType:UIButtonTypeSystem];

              button.frame = CGRectMake(
                  14,
                  y,
                  host.bounds.size.width - 28,
                  42
              );

              button.autoresizingMask = UIViewAutoresizingFlexibleWidth;

              button.backgroundColor = [UIColor colorWithRed:0.28
                                                        green:0.15
                                                         blue:0.48
                                                        alpha:1];

              button.layer.cornerRadius = 10;

              [button setTitle:title forState:UIControlStateNormal];

              [button setTitleColor:UIColor.whiteColor
                           forState:UIControlStateNormal];

              button.titleLabel.font =
                  [UIFont systemFontOfSize:13 weight:UIFontWeightSemibold];

              [button addTarget:target
                         action:action
               forControlEvents:UIControlEventTouchUpInside];

              [host addSubview:button];
          }

          @interface VSTController : NSObject

          + (instancetype)shared;

          - (void)show;
          - (void)togglePanel;
          - (void)dragBubble:(UIPanGestureRecognizer *)gesture;
          - (void)refreshCodeLabel;

          - (void)feature1;
          - (void)feature3;
          - (void)feature4;

          @end

          @implementation VSTController

          + (instancetype)shared {
              static VSTController *instance;
              static dispatch_once_t onceToken;

              dispatch_once(&onceToken, ^{
                  instance = [VSTController new];
              });

              return instance;
          }

          - (void)show {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (VSTWindow) {
                      VSTWindow.hidden = NO;
                      return;
                  }

                  UIWindowScene *windowScene = nil;

                  for (UIScene *scene in UIApplication.sharedApplication.connectedScenes) {
                      if ([scene isKindOfClass:UIWindowScene.class]) {
                          windowScene = (UIWindowScene *)scene;
                          break;
                      }
                  }

                  if (!windowScene) {
                      return;
                  }

                  VSTWindow = [[VSTOverlayWindow alloc]
                      initWithWindowScene:windowScene];

                  VSTWindow.frame = UIScreen.mainScreen.bounds;
                  VSTWindow.windowLevel = UIWindowLevelAlert + 2;
                  VSTWindow.backgroundColor = UIColor.clearColor;

                  UIViewController *root = [UIViewController new];

                  root.view.backgroundColor = UIColor.clearColor;

                  VSTWindow.rootViewController = root;

                  UIButton *bubble = [UIButton buttonWithType:UIButtonTypeCustom];

                  bubble.frame = CGRectMake(18, 180, 54, 54);
                  bubble.layer.cornerRadius = 27;

                  bubble.backgroundColor =
                      [UIColor colorWithRed:0.31 green:0.13 blue:0.56 alpha:0.96];

                  bubble.layer.borderWidth = 1.5;
                  bubble.layer.borderColor =
                      [UIColor colorWithWhite:1 alpha:0.7].CGColor;

                  [bubble setTitle:@"VST" forState:UIControlStateNormal];

                  bubble.titleLabel.font = [UIFont boldSystemFontOfSize:14];

                  [bubble addTarget:self
                             action:@selector(togglePanel)
                   forControlEvents:UIControlEventTouchUpInside];

                  [root.view addSubview:bubble];

                  UIPanGestureRecognizer *pan =
                      [[UIPanGestureRecognizer alloc]
                          initWithTarget:self
                                  action:@selector(dragBubble:)];

                  [bubble addGestureRecognizer:pan];

                  CGFloat width = UIScreen.mainScreen.bounds.size.width - 36;

                  VSTPanel = [[UIView alloc] initWithFrame:
                      CGRectMake(18, 245, width, 330)];

                  VSTPanel.backgroundColor =
                      [UIColor colorWithRed:0.055 green:0.045 blue:0.085 alpha:0.97];

                  VSTPanel.layer.cornerRadius = 18;
                  VSTPanel.layer.borderWidth = 1;

                  VSTPanel.layer.borderColor =
                      [UIColor colorWithRed:0.48 green:0.31 blue:0.72 alpha:1].CGColor;

                  VSTPanel.hidden = YES;

                  [root.view addSubview:VSTPanel];

                  UILabel *title = [[UILabel alloc]
                      initWithFrame:CGRectMake(14, 9, width - 28, 25)];

                  title.text = @"VideoStarTool";
                  title.textColor = UIColor.whiteColor;
                  title.font = [UIFont boldSystemFontOfSize:18];
                  title.textAlignment = NSTextAlignmentCenter;

                  [VSTPanel addSubview:title];

                  UILabel *owner = [[UILabel alloc]
                      initWithFrame:CGRectMake(14, 33, width - 28, 17)];

                  owner.text = @"Hoàng Hiệp";
                  owner.textColor = [UIColor colorWithWhite:0.75 alpha:1];
                  owner.font = [UIFont systemFontOfSize:11];
                  owner.textAlignment = NSTextAlignmentCenter;

                  [VSTPanel addSubview:owner];

                  UILabel *tab = [[UILabel alloc]
                      initWithFrame:CGRectMake(14, 58, 100, 23)];

                  tab.text = @"Function";
                  tab.textColor = UIColor.whiteColor;
                  tab.font = [UIFont boldSystemFontOfSize:13];

                  [VSTPanel addSubview:tab];

                  VSTCodeLabel = [[UILabel alloc]
                      initWithFrame:CGRectMake(14, 80, width - 28, 28)];

                  VSTCodeLabel.textColor = [UIColor colorWithWhite:0.88 alpha:1];
                  VSTCodeLabel.font = [UIFont systemFontOfSize:10];
                  VSTCodeLabel.numberOfLines = 1;
                  VSTCodeLabel.lineBreakMode = NSLineBreakByTruncatingMiddle;

                  [VSTPanel addSubview:VSTCodeLabel];

                  [self refreshCodeLabel];

                  VSTButton(
                      VSTPanel,
                      @"1. Auto Nhập Ảnh Vào Các Lớp Hình Ảnh",
                      114,
                      @selector(feature1),
                      self
                  );

                  VSTButton(
                      VSTPanel,
                      @"2. Hiển Thị Code Gần Nhất Từng Nhập",
                      162,
                      @selector(refreshCodeLabel),
                      self
                  );

                  VSTButton(
                      VSTPanel,
                      @"3. Auto Chia Beat Nhạc Thông Minh",
                      210,
                      @selector(feature3),
                      self
                  );

                  VSTButton(
                      VSTPanel,
                      @"4. Auto Nhập Code Và Ảnh Vào Các Phân Cảnh",
                      258,
                      @selector(feature4),
                      self
                  );

                  VSTStatus = [[UILabel alloc]
                      initWithFrame:CGRectMake(14, 304, width - 28, 20)];

                  VSTStatus.text = @"Sẵn sàng";
                  VSTStatus.textColor = [UIColor colorWithWhite:0.72 alpha:1];
                  VSTStatus.font = [UIFont systemFontOfSize:10];
                  VSTStatus.textAlignment = NSTextAlignmentCenter;

                  [VSTPanel addSubview:VSTStatus];

                  [VSTWindow makeKeyAndVisible];
              });
          }

          - (void)togglePanel {
              VSTPanel.hidden = !VSTPanel.hidden;
          }

          - (void)dragBubble:(UIPanGestureRecognizer *)gesture {
              UIView *view = gesture.view;

              CGPoint point = [gesture translationInView:view.superview];

              view.center = CGPointMake(
                  view.center.x + point.x,
                  view.center.y + point.y
              );

              [gesture setTranslation:CGPointZero inView:view.superview];
          }

          - (void)refreshCodeLabel {
              NSString *code =
                  [[NSUserDefaults standardUserDefaults]
                      stringForKey:VSTLastCodeKey];

              VSTCodeLabel.text = code.length
                  ? [NSString stringWithFormat:@"Code gần nhất: %@", code]
                  : @"Code gần nhất: Chưa có code được nhập";
          }

          // FEATURE 1
          // Scan existing image layers and attempt image insertion.

          - (void)feature1 {
              if (VSTBusy) {
                  return;
              }

              VSTBusy = YES;

              PHAuthorizationStatus status =
                  PHPhotoLibrary.authorizationStatus;

              void (^begin)(void) = ^{
                  id editor = VSTActiveEditor();
                  id engine = VSTCall(editor, @"engine");

                  if (!editor || !engine) {
                      VSTSetStatus(@"Mở màn hình chỉnh sửa trước");
                      VSTBusy = NO;
                      return;
                  }

                  PHFetchOptions *options = [PHFetchOptions new];

                  options.sortDescriptors = @[
                      [NSSortDescriptor
                          sortDescriptorWithKey:@"creationDate"
                                      ascending:NO]
                  ];

                  options.predicate = [NSPredicate predicateWithFormat:
                      @"mediaType == %d", PHAssetMediaTypeImage];

                  PHFetchResult<PHAsset *> *assets =
                      [PHAsset fetchAssetsWithOptions:options];

                  if (!assets.count) {
                      VSTSetStatus(@"Thư viện không có ảnh");
                      VSTBusy = NO;
                      return;
                  }

                  NSMutableArray *eligible = [NSMutableArray array];

                  SEL layerSelector = NSSelectorFromString(@"layerAtLayerNum:");
                  SEL assetSelector = NSSelectorFromString(@"assetForLayer:");
                  SEL typeSelector = NSSelectorFromString(@"layerTypeForLayer:");

                  for (NSInteger index = 0; index < 40; index++) {
                      id layer = ((id(*)(id, SEL, NSInteger))objc_msgSend)(
                          engine,
                          layerSelector,
                          index
                      );

                      if (!layer || VSTBool(engine, @"isNullLayer:")) {
                          continue;
                      }

                      NSInteger type = 0;

                      if ([engine respondsToSelector:typeSelector]) {
                          type = ((NSInteger(*)(id, SEL, id))objc_msgSend)(
                              engine,
                              typeSelector,
                              layer
                          );
                      }

                      id asset = ((id(*)(id, SEL, id))objc_msgSend)(
                          engine,
                          assetSelector,
                          layer
                      );

                      if (asset && type == 0) {
                          [eligible addObject:@{
                              @"index": @(index),
                              @"type": @(type)
                          }];
                      }
                  }

                  if (!eligible.count) {
                      VSTSetStatus(@"Không tìm thấy lớp ảnh phù hợp");
                      VSTBusy = NO;
                      return;
                  }

                  PHImageRequestOptions *request = [PHImageRequestOptions new];

                  request.synchronous = YES;
                  request.networkAccessAllowed = YES;
                  request.deliveryMode =
                      PHImageRequestOptionsDeliveryModeHighQualityFormat;

                  NSUInteger count = MIN(assets.count, eligible.count);

                  NSUInteger completed = 0;
                  NSUInteger failed = 0;

                  SEL setup = NSSelectorFromString(
                      @"setupImage:layerNum:layerType:clearMask:"
                  );

                  if (![engine respondsToSelector:setup]) {
                      VSTSetStatus(@"Không tìm thấy API nhập ảnh");
                      VSTBusy = NO;
                      return;
                  }

                  for (NSUInteger i = 0; i < count; i++) {
                      PHAsset *photoAsset = assets[i];

                      NSDictionary *target = eligible[i];

                      __block UIImage *image = nil;

                      [[PHImageManager defaultManager]
                          requestImageForAsset:photoAsset
                                   targetSize:CGSizeMake(2048, 2048)
                                  contentMode:PHImageContentModeAspectFit
                                      options:request
                                resultHandler:^(UIImage *result,
                                                NSDictionary *info) {
                          if (![info[PHImageCancelledKey] boolValue] &&
                              !info[PHImageErrorKey]) {
                              image = result;
                          }
                      }];

                      if (!image) {
                          failed++;
                          continue;
                      }

                      NSInteger layerIndex =
                          [target[@"index"] integerValue];

                      NSInteger layerType =
                          [target[@"type"] integerValue];

                      id result = nil;

                      for (NSUInteger attempt = 0; attempt < 3; attempt++) {
                          result = ((id(*)(id, SEL, id, NSInteger, NSInteger, BOOL))
                              objc_msgSend)(
                                  engine,
                                  setup,
                                  image,
                                  layerIndex,
                                  layerType,
                                  YES
                              );

                          id checkLayer =
                              ((id(*)(id, SEL, NSInteger))objc_msgSend)(
                                  engine,
                                  layerSelector,
                                  layerIndex
                              );

                          id checkAsset = checkLayer
                              ? ((id(*)(id, SEL, id))objc_msgSend)(
                                  engine,
                                  assetSelector,
                                  checkLayer
                              )
                              : nil;

                          if (result || checkAsset) {
                              break;
                          }
                      }

                      if (result) {
                          completed++;
                      } else {
                          failed++;
                      }
                  }

                  VSTSetStatus([NSString stringWithFormat:
                      @"Đã nhập %lu ảnh • lỗi %lu",
                      (unsigned long)completed,
                      (unsigned long)failed]);

                  VSTBusy = NO;
              };

              if (status == PHAuthorizationStatusAuthorized ||
                  status == PHAuthorizationStatusLimited) {
                  begin();
              } else {
                  [PHPhotoLibrary requestAuthorizationForAccessLevel:
                      PHAccessLevelReadWrite
                      handler:^(PHAuthorizationStatus newStatus) {
                      if (newStatus == PHAuthorizationStatusAuthorized ||
                          newStatus == PHAuthorizationStatusLimited) {
                          dispatch_async(dispatch_get_main_queue(), begin);
                      } else {
                          VSTSetStatus(@"Chưa cấp quyền Ảnh");
                          VSTBusy = NO;
                      }
                  }];
              }
          }

          // FEATURE 3
          // Obtain beat positions from the native timeline beat API.

          - (void)feature3 {
              if (VSTBusy) {
                  return;
              }

              VSTBusy = YES;

              UIView *root = VSTTopController().view;

              UIView *splitView = VSTFindView(root, @"MultiSplitView");

              if (!splitView) {
                  VSTSetStatus(@"Không tìm thấy MultiSplitView");
                  VSTBusy = NO;
                  return;
              }

              id timeline = nil;

              @try {
                  timeline = [splitView valueForKey:@"timeline"];
              } @catch (__unused NSException *exception) {
                  timeline = nil;
              }

              NSArray *beats = nil;

              SEL beatSelector =
                  NSSelectorFromString(@"beatTimesForTimeline:");

              if (timeline && [splitView respondsToSelector:beatSelector]) {
                  beats = ((id(*)(id, SEL, id))objc_msgSend)(
                      splitView,
                      beatSelector,
                      timeline
                  );
              }

              if (![beats isKindOfClass:NSArray.class] || !beats.count) {
                  VSTSetStatus(@"Không lấy được beat từ timeline");
                  VSTBusy = NO;
                  return;
              }

              NSMutableArray *splitTimes = [NSMutableArray array];

              for (id beat in beats) {
                  if (![beat isKindOfClass:NSNumber.class]) {
                      continue;
                  }

                  double seconds = [beat doubleValue];

                  if (!isfinite(seconds) || seconds <= 0) {
                      continue;
                  }

                  [splitTimes addObject:
                      [NSValue valueWithCMTime:
                          CMTimeMakeWithSeconds(seconds, 600)]];
              }

              if (!splitTimes.count) {
                  VSTSetStatus(@"Không có mốc beat hợp lệ");
                  VSTBusy = NO;
                  return;
              }

              SEL insertSelector = NSSelectorFromString(@"insertSplitTime:");

              if (![splitView respondsToSelector:insertSelector]) {
                  VSTSetStatus(@"Không tìm thấy API chèn điểm chia");
                  VSTBusy = NO;
                  return;
              }

              NSUInteger inserted = 0;

              for (NSValue *value in splitTimes) {
                  CMTime time = kCMTimeZero;

                  [value getValue:&time];

                  SEL canSplit = NSSelectorFromString(@"canSplitAt:");

                  if ([splitView respondsToSelector:canSplit]) {
                      BOOL allowed = ((BOOL(*)(id, SEL, CMTime))objc_msgSend)(
                          splitView,
                          canSplit,
                          time
                      );

                      if (!allowed) {
                          continue;
                      }
                  }

                  ((void(*)(id, SEL, CMTime))objc_msgSend)(
                      splitView,
                      insertSelector,
                      time
                  );

                  inserted++;
              }

              VSTSetStatus([NSString stringWithFormat:
                  @"Đã gửi %lu mốc beat vào timeline",
                  (unsigned long)inserted]);

              VSTBusy = NO;
          }

          // FEATURE 4
          // Generate a QR image and pair it with a selected photo for scenes.

          - (void)feature4 {
              UIAlertController *alert =
                  [UIAlertController
                      alertControllerWithTitle:
                          @"Auto Nhập Code Và Ảnh Vào Các Phân Cảnh"
                      message:
                          @"Nhập code và phạm vi scene cần xử lý."
                      preferredStyle:UIAlertControllerStyleAlert];

              [alert addTextFieldWithConfigurationHandler:^(UITextField *field) {
                  field.placeholder = @"Code QR";
                  field.autocapitalizationType =
                      UITextAutocapitalizationTypeNone;
              }];

              [alert addTextFieldWithConfigurationHandler:^(UITextField *field) {
                  field.placeholder = @"Scene bắt đầu (0-based)";
                  field.keyboardType = UIKeyboardTypeNumberPad;
                  field.text = @"0";
              }];

              [alert addTextFieldWithConfigurationHandler:^(UITextField *field) {
                  field.placeholder = @"Scene kết thúc (0-based)";
                  field.keyboardType = UIKeyboardTypeNumberPad;
                  field.text = @"0";
              }];

              [alert addTextFieldWithConfigurationHandler:^(UITextField *field) {
                  field.placeholder = @"Scene offset";
                  field.keyboardType = UIKeyboardTypeNumberPad;
                  field.text = @"0";
              }];

              [alert addAction:
                  [UIAlertAction actionWithTitle:@"Hủy"
                                           style:UIAlertActionStyleCancel
                                         handler:nil]];

              [alert addAction:
                  [UIAlertAction actionWithTitle:@"Chạy"
                                           style:UIAlertActionStyleDefault
                                         handler:^(UIAlertAction *action) {

                  NSArray *fields = alert.textFields;

                  NSString *code = [fields[0].text
                      stringByTrimmingCharactersInSet:
                          NSCharacterSet.whitespaceAndNewlineCharacterSet];

                  NSInteger start = [fields[1].text integerValue];
                  NSInteger end = [fields[2].text integerValue];
                  NSInteger offset = [fields[3].text integerValue];

                  id project = VSTActiveProject();

                  if (!project || !code.length || start < 0 ||
                      end < start) {
                      VSTSetStatus(@"Thông tin nhập không hợp lệ");
                      return;
                  }

                  NSUInteger sceneCount =
                      ((NSUInteger(*)(id, SEL))objc_msgSend)(
                          project,
                          NSSelectorFromString(@"sceneCount")
                      );

                  NSInteger targetStart = start + offset;
                  NSInteger targetEnd = end + offset;

                  if (targetStart < 0 ||
                      targetEnd < targetStart ||
                      (NSUInteger)targetEnd >= sceneCount) {
                      VSTSetStatus(@"Scene offset vượt phạm vi project");
                      return;
                  }

                  Class qrClass = NSClassFromString(@"QRCodeManager");

                  SEL sharedSelector = NSSelectorFromString(@"sharedInstance");

                  id qrManager = qrClass &&
                      [qrClass respondsToSelector:sharedSelector]
                      ? ((id(*)(id, SEL))objc_msgSend)(
                          qrClass,
                          sharedSelector
                      )
                      : nil;

                  SEL validSelector = NSSelectorFromString(@"validQRCheck:");

                  if ([qrManager respondsToSelector:validSelector]) {
                      BOOL valid = ((BOOL(*)(id, SEL, id))objc_msgSend)(
                          qrManager,
                          validSelector,
                          code
                      );

                      if (!valid) {
                          VSTSetStatus(@"Code QR không hợp lệ");
                          return;
                      }
                  }

                  CIQRCodeGenerator *generator =
                      [CIQRCodeGenerator filterWithName:@"CIQRCodeGenerator"];

                  [generator setValue:[code dataUsingEncoding:NSUTF8StringEncoding]
                               forKey:@"inputMessage"];

                  [generator setValue:@"M" forKey:@"inputCorrectionLevel"];

                  CIImage *output = generator.outputImage;

                  if (!output) {
                      VSTSetStatus(@"Không tạo được QR");
                      return;
                  }

                  CGAffineTransform transform =
                      CGAffineTransformMakeScale(8, 8);

                  CIImage *scaled = [output imageByApplyingTransform:transform];

                  CIContext *context = [CIContext contextWithOptions:nil];

                  CGImageRef cgImage =
                      [context createCGImage:scaled fromRect:scaled.extent];

                  if (!cgImage) {
                      VSTSetStatus(@"Không tạo được ảnh QR");
                      return;
                  }

                  UIImage *qrImage = [UIImage imageWithCGImage:cgImage];

                  CGImageRelease(cgImage);

                  PHFetchOptions *options = [PHFetchOptions new];

                  options.sortDescriptors = @[
                      [NSSortDescriptor
                          sortDescriptorWithKey:@"creationDate"
                                      ascending:NO]
                  ];

                  options.predicate = [NSPredicate predicateWithFormat:
                      @"mediaType == %d", PHAssetMediaTypeImage];

                  PHFetchResult<PHAsset *> *assets =
                      [PHAsset fetchAssetsWithOptions:options];

                  NSUInteger needed = (NSUInteger)(end - start + 1);

                  if (assets.count < needed) {
                      VSTSetStatus(@"Không đủ ảnh trong thư viện");
                      return;
                  }

                  Class navClass =
                      NSClassFromString(@"MultiLayerNavController");

                  SEL initializer =
                      NSSelectorFromString(@"initWithProject:sceneIndex:");

                  SEL setup =
                      NSSelectorFromString(
                          @"setupImage:layerNum:layerType:clearMask:"
                      );

                  if (!navClass ||
                      ![navClass instancesRespondToSelector:initializer]) {
                      VSTSetStatus(@"Không tạo được editor cho scene");
                      return;
                  }

                  PHImageRequestOptions *request = [PHImageRequestOptions new];

                  request.synchronous = YES;
                  request.networkAccessAllowed = YES;
                  request.deliveryMode =
                      PHImageRequestOptionsDeliveryModeHighQualityFormat;

                  NSUInteger success = 0;
                  NSUInteger failed = 0;

                  NSMutableArray *editors = [NSMutableArray array];

                  for (NSInteger scene = targetStart;
                       scene <= targetEnd;
                       scene++) {

                      NSUInteger assetIndex =
                          (NSUInteger)(scene - targetStart);

                      PHAsset *photoAsset = assets[assetIndex];

                      __block UIImage *photo = nil;

                      [[PHImageManager defaultManager]
                          requestImageForAsset:photoAsset
                                   targetSize:CGSizeMake(2048, 2048)
                                  contentMode:PHImageContentModeAspectFit
                                      options:request
                                resultHandler:^(UIImage *image,
                                                NSDictionary *info) {
                          if (![info[PHImageCancelledKey] boolValue] &&
                              !info[PHImageErrorKey]) {
                              photo = image;
                          }
                      }];

                      if (!photo) {
                          failed++;
                          continue;
                      }

                      id editor = ((id(*)(id, SEL, id, NSUInteger))objc_msgSend)(
                          [navClass alloc],
                          initializer,
                          project,
                          (NSUInteger)scene
                      );

                      if (!editor) {
                          failed++;
                          continue;
                      }

                      [editors addObject:editor];

                      if ([editor respondsToSelector:
                          @selector(loadViewIfNeeded)]) {
                          [editor loadViewIfNeeded];
                      }

                      id engine = VSTCall(editor, @"engine");

                      if (!engine || ![engine respondsToSelector:setup]) {
                          failed++;
                          continue;
                      }

                      id photoResult =
                          ((id(*)(id, SEL, id, NSInteger, NSInteger, BOOL))
                              objc_msgSend)(
                                  engine,
                                  setup,
                                  photo,
                                  0,
                                  0,
                                  YES
                              );

                      id qrResult =
                          ((id(*)(id, SEL, id, NSInteger, NSInteger, BOOL))
                              objc_msgSend)(
                                  engine,
                                  setup,
                                  qrImage,
                                  1,
                                  0,
                                  YES
                              );

                      if (photoResult && qrResult) {
                          success++;
                      } else {
                          failed++;
                      }
                  }

                  [[NSUserDefaults standardUserDefaults]
                      setObject:code
                         forKey:VSTLastCodeKey];

                  NSData *imageData = UIImagePNGRepresentation(qrImage);

                  if (imageData) {
                      [[NSUserDefaults standardUserDefaults]
                          setObject:imageData
                             forKey:VSTLastCodeImageKey];
                  }

                  [self refreshCodeLabel];

                  VSTSetStatus([NSString stringWithFormat:
                      @"Scene thành công: %lu • lỗi: %lu",
                      (unsigned long)success,
                      (unsigned long)failed]);

              }]];

              [VSTTopController() presentViewController:alert
                                               animated:YES
                                             completion:nil];
          }

          @end

          %hook QRCodeManager

          - (void)selectedCode:(id)code withImageData:(NSData *)imageData {
              %orig;

              NSString *value = [code isKindOfClass:NSString.class]
                  ? code
                  : ([code respondsToSelector:@selector(description)]
                      ? [code description]
                      : nil);

              if (value.length) {
                  [[NSUserDefaults standardUserDefaults]
                      setObject:value
                         forKey:VSTLastCodeKey];
              }

              if ([imageData isKindOfClass:NSData.class]) {
                  [[NSUserDefaults standardUserDefaults]
                      setObject:imageData
                         forKey:VSTLastCodeImageKey];
              }

              [[VSTController shared]
                  performSelectorOnMainThread:@selector(refreshCodeLabel)
                                   withObject:nil
                                waitUntilDone:NO];
          }

          %end

          %ctor {
              @autoreleasepool {
                  if (![NSBundle.mainBundle.bundleIdentifier
                      isEqualToString:@"com.frontierdesign.videostar"]) {
                      return;
                  }

                  [[NSNotificationCenter defaultCenter]
                      addObserverForName:UIApplicationDidBecomeActiveNotification
                                  object:nil
                                   queue:NSOperationQueue.mainQueue
                              usingBlock:^(NSNotification *notification) {

                      dispatch_after(
                          dispatch_time(DISPATCH_TIME_NOW,
                              (int64_t)(1.5 * NSEC_PER_SEC)),
                          dispatch_get_main_queue(), ^{
                              [[VSTController shared] show];
                          }
                      );
                  }];

                  dispatch_after(
                      dispatch_time(DISPATCH_TIME_NOW,
                          (int64_t)(3 * NSEC_PER_SEC)),
                      dispatch_get_main_queue(), ^{
                          [[VSTController shared] show];
                      }
                  );
              }
          }
          SOURCE

      - name: Build arm64 dylib
        run: |
          export THEOS="$HOME/theos"
          export THEOS_PACKAGE_SCHEME=rootless

          make package FINALPACKAGE=1

          mkdir -p output

          DEB="$(find packages -maxdepth 1 -name '*.deb' | sort | tail -n 1)"

          if [ -z "$DEB" ]; then
            echo "ERROR: Package was not generated"
            exit 1
          fi

          dpkg-deb -x "$DEB" extracted

          DYLIB="$(find extracted -name 'VideoStarTool.dylib' | head -n 1)"

          if [ -z "$DYLIB" ]; then
            echo "ERROR: VideoStarTool.dylib not found"
            exit 1
          fi

          cp "$DYLIB" output/VideoStarTool.dylib
          cp "$DEB" output/VideoStarTool-rootless.deb

          file output/VideoStarTool.dylib

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-iOS-arm64
          path: output/*
          if-no-files-found: error
